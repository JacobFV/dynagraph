# gb10 physical-memory sprint configuration. all numeric budgets are engineering
# choices, not measured capabilities.
sprint:
  start_utc: "2026-11-23T04:45:53Z"
  hard_stop_utc: "2026-11-23T16:45:53Z"
  host: gb10-direct            # promaxgb10-4dfb, NVIDIA GB10 cc 12.1, aarch64
  memory_budget_gb: 100
  memory_reserve_gb: 15
  heavy_gpu_lock: ~/dynagraph/.gpu_heavy.lock

paths:
  data: data
  results: results
  checkpoint: ckpt/Inkling-2-Mini

inkling:
  repo: thinkingmachines/Inkling-2-Mini
  revision: b85c3cfa615fc413cc9af3379f491b963f3b586a
  quantization: modelopt NVFP4 experts / MXFP8 (dequantized to bf16 at load)
  core_layers: [6, 18]        # loop_config core_start, core_end (exclusive)
  num_passes: 3
  # HF names self_attn.{q,k,v,o}_proj.linear == native attn.wq_du/wk_dv/wv_dv/wo_ud (NeMo "qkvr" also fuses wr_du; not adapted)
  lora: {rank: 8, alpha: 32, targets: ["self_attn.q_proj.linear", "self_attn.k_proj.linear", "self_attn.v_proj.linear", "self_attn.o_proj.linear"], layers: core}
  max_core_tokens: 128        # actual sequence: 49 tokens (prefix + 1 query + 16 readout)
  max_memory_slots: 64
  batch_size: 8               # gate: bs8 1.28 s/step; bs32 superlinear (11.7 s)
  lr: 3.0e-4
  run_minutes: 35
  gate_minutes: 120
  variants: [i00, i11]
  seeds: [0, 1]
  schedule: "seed0: i00, i11, i11nolora (diagnostic: same memory/heads, no core LoRA); seed1: i00, i11"

compact:
  width: 128
  heads: 4
  shared_blocks: 2
  train_passes: [1, 2, 4]
  eval_passes: [1, 2, 4, 8]   # 8 = extrapolation
  variants: [b00, b10, b01, b11]
  seeds: [0, 1, 2]
  target_minutes_per_run: 8
  dataset: v2

data:
  train_roots: 4096
  val_roots: 512
  test_roots: 512
  pushes_per_root: 4
  obs_hz: 20
  heldout_hz: [10, 40]
  occlusion_s: [0.0, 0.2, 0.5, 1.0]
  delay_intervals: [0, 1, 3]
  drop_prob: [0.0, 0.25, 0.5]
  friction_train: [0.3, 0.7]
  friction_stress: [0.15, 0.9]
  horizons_s: [0.1, 0.25, 0.5, 1.0, 1.5, 2.0]
  primary_horizons_s: [0.1, 0.5, 1.0]

g1:
  fixed_base: true
  push_success: {pos_tol_m: 0.03, speed_tol_mps: 0.02, settle_s: 0.5}
  lift_success: {clearance_m: 0.02, pos_tol_m: 0.03, speed_tol_mps: 0.02, ang_tol_radps: 0.1, settle_s: 0.5}
  episode_cap_s: 15.0
  lift_gate: {trials: 10, required: 8}
  paired_trials: 20

stats:
  bootstrap_resamples: 2000
  ci: 0.95
